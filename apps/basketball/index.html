<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1d2b"><title>篮球：全场掌控 · Court Master V0.2</title><link rel="stylesheet" href="/play/basketball/style.css"></head>
<body><main class="app" id="app"><header class="hud"><div class="title"><span>COURT MASTER</span><small data-zh="篮球 · 全场掌控" data-en="2D BASKETBALL">篮球 · 全场掌控</small></div><div class="scoreboard"><span class="team blue" data-zh="蓝队" data-en="BLUE">蓝队</span><strong id="blueScore">0</strong><span class="dash">:</span><strong id="redScore">0</strong><span class="team red" data-zh="红队" data-en="RED">红队</span></div><div class="clocks"><span id="clock">03:00</span><span class="shot" id="shotClock">24</span></div><div class="menu"><button id="difficulty" type="button" aria-label="AI difficulty">AI · 标准</button><button id="pause" type="button" aria-label="Pause game">⏸ 暂停</button><button id="lang" type="button">中 / EN</button><button id="theme" type="button" data-zh="球场风格" data-en="Court Theme">球场风格</button><button id="restart" type="button" data-zh="重赛" data-en="Restart">重赛</button></div></header>
<section class="arena"><canvas id="court" width="1120" height="660" aria-label="2D Basketball Game Court"></canvas><div class="ticker" id="eventText" aria-live="polite"></div><div class="tips" id="startTip" data-zh="WASD 移动 · J 蓄力投篮 · K 传球/抢断 · Shift 加速 · 空格换人" data-en="WASD move · Hold J to shoot · K pass/steal · Shift sprint · Space switch">WASD 移动 · J 蓄力投篮 · K 传球/抢断 · Shift 加速 · 空格换人</div><div class="meter"><div class="meterTitle"><span data-zh="投篮蓄力" data-en="SHOT TIMING">投篮蓄力</span><span id="chargeNum">0%</span></div><div class="track"><i class="target"></i><i id="chargeBar"></i></div></div><div class="pausedBadge" id="pausedBadge" hidden>⏸ 暂停</div><div class="result" id="result" hidden><h2 id="resultTitle"></h2><p id="resultScore"></p><button id="again" type="button" data-zh="再来一局" data-en="Play Again">再来一局</button></div></section>
<footer class="controls"><div class="controlHint"><span><b>WASD</b> <i data-zh="移动" data-en="Move">移动</i></span><span><b>J</b> <i data-zh="投篮" data-en="Shoot">投篮</i></span><span><b>K</b> <i data-zh="传球 / 抢断" data-en="Pass / Steal">传球 / 抢断</i></span><span><b>SPACE</b> <i data-zh="换人" data-en="Switch">换人</i></span><span><b>P</b> <i data-zh="暂停" data-en="Pause">暂停</i></span></div><div class="actionBtns"><button id="switchBtn" data-zh="切换球员" data-en="Switch">切换球员</button><button id="passBtn" data-zh="传球 / 抢断" data-en="Pass / Steal">传球 / 抢断</button><button id="shootBtn" class="primary" data-zh="投篮 / 盖帽" data-en="Shoot / Block">投篮 / 盖帽</button><button id="labBtn" data-zh="∑ 算法" data-en="∑ Lab">∑ 算法</button><button id="academyBtn" data-zh="课程" data-en="Lessons">课程</button></div></footer>
<div class="joystick" id="joystick" aria-label="Touch move joystick"><div class="joystickHat" id="joyHat"></div></div>
<aside id="drawer" class="drawer" hidden><div class="drawerHeader"><div><small>COURT MASTER / ACADEMY</small><h2 id="drawerTitle">篮球算法实验室</h2></div><button id="closeDrawer" type="button" aria-label="Close">✕</button></div><div id="drawerBody"></div></aside><div id="shade" class="shade" hidden></div><div class="footerNote">V0.2 · LOCAL 3v3 VS AI · <span data-zh="非十人联机版" data-en="Not multiplayer yet">非十人联机版</span></div>
</main><script type="module" src="/play/basketball/game.js"></script></body></html>
